<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel | YUNNITED CREW</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #07070a;
    --surface: #101015;
    --surface-2: #16161c;
    --border: rgba(255,255,255,.07);
    --border-strong: rgba(255,255,255,.14);
    --text: #f5f5f7;
    --muted: #8a8a94;
    --accent: #7c5cff;
    --green: #22c55e;
    --amber: #f5b400;
    --cyan: #22d3ee;
    --pink: #ec4899;
  }
  body {
    background: radial-gradient(1200px 600px at 50% -200px, #16121f 0%, var(--bg) 55%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Arial, sans-serif;
    margin: 0; padding: 20px 16px 40px;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  .wrap { max-width: 980px; margin: 0 auto; }

  /* ---------- HERO ---------- */
  .hero {
    display: flex; justify-content: space-between; align-items: center;
    gap: 16px; margin-bottom: 24px; flex-wrap: wrap;
  }
  .hero-left { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .brand-mark svg { width: 22px; height: 22px; }
  .brand-mark {
    width: 48px; height: 48px; border-radius: 14px;
    background: linear-gradient(135deg, #7c5cff 0%, #b44cff 100%);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 17px; color: #fff; letter-spacing: .5px;
    box-shadow: 0 8px 24px rgba(124,92,255,.35), inset 0 1px 0 rgba(255,255,255,.2);
    flex-shrink: 0;
  }
  .brand-title { font-size: 20px; font-weight: 800; letter-spacing: .3px; margin: 0; }
  .brand-sub { color: var(--muted); font-size: 12.5px; margin: 3px 0 0; }
  .hero-right { display: flex; align-items: center; gap: 10px; }
  .user-chip {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 12px 6px 6px; border-radius: 999px;
    background: var(--surface); border: 1px solid var(--border);
  }
  .avatar {
    width: 32px; height: 32px; border-radius: 50%;
    background: linear-gradient(135deg, #2a2a35, #1a1a22);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 13px; color: #fff;
    border: 1px solid var(--border-strong);
  }
  .user-name { font-size: 13px; font-weight: 600; line-height: 1.2; }
  .user-role { font-size: 11px; color: var(--muted); line-height: 1.2; margin-top: 1px; }
  .logout {
    background: transparent; border: 1px solid var(--border);
    color: var(--text); padding: 9px 14px; border-radius: 10px;
    font-size: 13px; font-weight: 600; cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  .logout:hover { background: var(--surface); border-color: var(--border-strong); }

  /* ---------- QUICK STATS ---------- */
  .quick {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
    margin-bottom: 26px; padding: 14px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px;
  }
  .qitem {
    display: flex; flex-direction: column; gap: 2px;
    padding: 4px 10px; border-left: 1px solid var(--border);
  }
  .qitem:first-child { border-left: 0; }
  .qnum { font-size: 17px; font-weight: 700; letter-spacing: -.3px; }
  .qlabel { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; font-weight: 600; }
  @media (max-width: 560px) {
    .quick { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .qitem:nth-child(3) { border-left: 0; }
    .qitem { padding: 6px 4px 6px 12px; }
    .qitem:nth-child(odd) { padding-left: 4px; }
  }

  /* ---------- CARDS ---------- */
  .section-title {
    font-size: 11.5px; color: var(--muted); text-transform: uppercase;
    letter-spacing: 1.2px; font-weight: 700; margin: 0 0 12px 4px;
  }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }

  .card {
    position: relative; display: block; text-decoration: none; color: var(--text);
    background: linear-gradient(160deg, var(--surface-2) 0%, var(--surface) 100%);
    border: 1px solid var(--border); border-radius: 18px;
    overflow: hidden;
    transition: transform .22s cubic-bezier(.2,.8,.2,1), border-color .22s, box-shadow .22s;
  }
  .card::before {
    content: ''; position: absolute; inset: 0; border-radius: 18px;
    padding: 1px; pointer-events: none; opacity: 0;
    background: linear-gradient(135deg, var(--card-accent, #fff), transparent 60%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    transition: opacity .25s;
  }
  .card:hover, .card:focus-visible {
    transform: translateY(-3px);
    border-color: transparent;
    box-shadow: 0 18px 40px -18px var(--card-accent, #000);
    outline: none;
  }
  .card:hover::before, .card:focus-visible::before { opacity: 1; }
  .card:active { transform: translateY(-1px); }

  .card-hero { height: 118px; position: relative; overflow: hidden; background: #0a0a0f; }
  .card-hero .thumb { position: absolute; inset: 0; display: flex; }
  .card-hero .thumb > div {
    flex: 1; background-size: cover; background-position: center;
    transition: transform .5s ease;
  }
  .card:hover .thumb > div { transform: scale(1.04); }
  .card-hero .thumb > div + div { border-left: 2px solid rgba(0,0,0,.5); }
  .card-hero::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 40%, rgba(16,16,21,.9) 100%);
    pointer-events: none;
  }

  .card-hero.icon {
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(circle at 50% 60%, var(--card-accent-soft, rgba(124,92,255,.14)) 0%, transparent 65%),
      linear-gradient(160deg, var(--surface-2), var(--surface));
  }
  .icon-box {
    width: 56px; height: 56px; border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    background: var(--card-accent-soft, rgba(124,92,255,.14));
    border: 1px solid var(--card-accent-border, rgba(124,92,255,.3));
    color: var(--card-accent, #7c5cff);
    box-shadow: 0 10px 30px -12px var(--card-accent, #7c5cff);
  }
  .icon-box svg { width: 26px; height: 26px; }

  .dots-row { display: flex; gap: 14px; align-items: center; justify-content: center; height: 100%; }
  .dot-big {
    width: 40px; height: 40px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.06);
    box-shadow: 0 6px 16px -8px rgba(0,0,0,.9);
  }

  .card-body { padding: 16px 18px 18px; position: relative; z-index: 1; }
  .card-title { font-size: 15.5px; font-weight: 700; margin: 0 0 6px; letter-spacing: -.2px; }
  .card-desc { font-size: 12.5px; color: var(--muted); line-height: 1.5; margin: 0 0 12px; }

  .card-badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 600; color: #c5c5cc;
    padding: 4px 10px; border-radius: 999px;
    background: rgba(255,255,255,.04); border: 1px solid var(--border);
  }
  .card-badge.live { color: var(--green); border-color: rgba(34,197,94,.25); background: rgba(34,197,94,.08); }
  .card-badge.live::before {
    content: ''; width: 6px; height: 6px; border-radius: 50%;
    background: var(--green); box-shadow: 0 0 8px var(--green);
  }

  .arrow {
    position: absolute; bottom: 18px; right: 18px;
    color: var(--muted); transition: color .2s, transform .2s;
  }
  .card:hover .arrow { color: var(--card-accent, #fff); transform: translateX(3px); }
  .arrow svg { width: 16px; height: 16px; }

  #msg { color: #ff5566; font-size: 13px; margin-bottom: 12px; }

  .header-divider {
    height: 1px;
    background: rgba(255,255,255,.12);
    margin: 0 0 24px;
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="hero">
    <div class="hero-left">
      <div class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg></div>
      <div>
        <h1 class="brand-title">YUNNITED CREW</h1>
        <p class="brand-sub">Painel de administração</p>
      </div>
    </div>
    <div class="hero-right">
      <div class="user-chip">
        <div class="avatar" id="avatar">?</div>
        <div>
          <div class="user-name" id="whoami">—</div>
          <div class="user-role" id="roleLabel">—</div>
        </div>
      </div>
      <button class="logout" id="logoutBtn">Sair</button>
    </div>
  </header>

  <div class="quick" id="quick"></div>

  <p class="section-title">Secções</p>
  <p id="msg"></p>
  <div class="cards" id="cards"></div>

</div>

<script src="/admin/admin-api.js"></script>
<script>
const { api, requireLogin, getUser } = window.YCAdmin;
if (!requireLogin()) throw new Error('redirect');

const user = getUser();
const uname = user?.username || '—';
document.getElementById('whoami').textContent = uname;
document.getElementById('roleLabel').textContent = user?.role === 'admin' ? 'Administrador' : (user?.role || '');
document.getElementById('avatar').textContent = uname.charAt(0).toUpperCase();

document.getElementById('logoutBtn').addEventListener('click', () => api.logoutRemote());

const svgProducts = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 12l9 4 9-4"/><path d="M3 17l9 4 9-4"/></svg>`;
const svgChart = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><rect x="7" y="12" width="3" height="6" rx=".6"/><rect x="12" y="8" width="3" height="10" rx=".6"/><rect x="17" y="5" width="3" height="13" rx=".6"/></svg>`;
const svgCloud = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 17a4 4 0 010-8 5 5 0 019.9-1A4 4 0 0118 17H6z"/></svg>`;
const svgUser = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>`;
const svgTag = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12l-8 8-9-9V4h7z"/><circle cx="7.5" cy="7.5" r="1.4"/></svg>`;
const svgArrow = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>`;

function card({ href, heroHtml, icon, accent, accentSoft, accentBorder, title, desc, badge }) {
  const hero = heroHtml
    ? `<div class="card-hero">${heroHtml}</div>`
    : `<div class="card-hero icon"><div class="icon-box">${icon}</div></div>`;
  return `<a class="card" href="${href}" style="--card-accent:${accent};--card-accent-soft:${accentSoft};--card-accent-border:${accentBorder}">
    ${hero}
    <div class="card-body">
      <h2 class="card-title">${title}</h2>
      <p class="card-desc">${desc}</p>
      ${badge ? `<span class="card-badge ${badge.live ? 'live' : ''}">${badge.text}</span>` : ''}
      <span class="arrow">${svgArrow}</span>
    </div>
  </a>`;
}

async function load() {
  let products = [], categories = [], stats = null, usage = null;
  const auth = { headers: { Authorization: 'Bearer ' + localStorage.getItem('yc_admin_token') } };
  try { products = await api.listProducts(); } catch {}
  try { categories = await api.listAllCategories(); } catch {}
  try { stats = await (await fetch('/api/stats', auth)).json(); } catch {}
  try { usage = await (await fetch('/api/cloudinary/usage', auth)).json(); } catch {}

  const total = stats?.totals?.total ?? products.length;
  const published = stats?.totals?.published ?? products.filter(p => p.active !== false).length;
  const stockValue = stats?.stockValue ?? 0;
  const cloudMB = usage?.storage?.usedMB ?? 0;
  const credits = usage?.credits?.used_percent ?? 0;

  document.getElementById('quick').innerHTML = `
    <div class="qitem"><span class="qnum">${total}</span><span class="qlabel">produtos</span></div>
    <div class="qitem"><span class="qnum">${categories.length}</span><span class="qlabel">categorias</span></div>
    <div class="qitem"><span class="qnum">${(stockValue/1000).toFixed(0)}k</span><span class="qlabel">MT em stock</span></div>
    <div class="qitem"><span class="qnum">${credits}%</span><span class="qlabel">cloudinary</span></div>
  `;

  const thumbs = products.filter(p => p.image).slice(0, 3)
    .map(p => `<div style="background-image:url('${p.image}')"></div>`).join('');
  const productsHero = thumbs ? `<div class="thumb">${thumbs}</div>` : null;

  const dots = categories.slice(0, 3)
    .map(c => `<div class="dot-big" style="background:${c.color || '#333'}"></div>`).join('');
  const catsHero = dots ? `<div class="dots-row">${dots}</div>` : null;

  document.getElementById('cards').innerHTML = [
    card({
      href: '/admin/produtos.html',
      heroHtml: productsHero,
      icon: svgProducts,
      accent: '#7c5cff',
      accentSoft: 'rgba(124,92,255,.14)',
      accentBorder: 'rgba(124,92,255,.3)',
      title: 'Produtos',
      desc: 'Adicionar, editar e organizar os produtos do marketplace. Preços, stock, imagens e descrições.',
      badge: { text: `${total} produto(s)` },
    }),
    card({
      href: '/admin/categorias.html',
      heroHtml: catsHero,
      icon: svgTag,
      accent: '#f5b400',
      accentSoft: 'rgba(245,180,0,.14)',
      accentBorder: 'rgba(245,180,0,.3)',
      title: 'Categorias',
      desc: 'Agrupar produtos por categoria, com cor, ícone e ordem de apresentação personalizados.',
      badge: { text: `${categories.length} categoria(s)` },
    }),
    card({
      href: '/admin/dashboard.html',
      icon: svgChart,
      accent: '#22c55e',
      accentSoft: 'rgba(34,197,94,.14)',
      accentBorder: 'rgba(34,197,94,.3)',
      title: 'Dashboard',
      desc: 'Visão geral do negócio: totais, valor em stock, categorias com mais itens e consumo Cloudinary.',
      badge: { text: `${published} publicados`, live: true },
    }),
    card({
      href: '/admin/armazenamento.html',
      icon: svgCloud,
      accent: '#22d3ee',
      accentSoft: 'rgba(34,211,238,.14)',
      accentBorder: 'rgba(34,211,238,.3)',
      title: 'Armazenamento',
      desc: 'Gerir as imagens no Cloudinary, ver o consumo e apagar imagens que já não estão em uso.',
      badge: { text: `${cloudMB} MB usados · ${credits}%`, live: true },
    }),
    card({
      href: '/admin/perfil.html',
      icon: svgUser,
      accent: '#ec4899',
      accentSoft: 'rgba(236,72,153,.14)',
      accentBorder: 'rgba(236,72,153,.3)',
      title: 'Perfil',
      desc: 'A tua conta, últimos acessos com IP e dispositivo, e opções para encerrar sessões ativas.',
      badge: { text: 'Sessão ativa', live: true },
    }),
  ].join('');
}

load();
</script>
</body>
</html>
