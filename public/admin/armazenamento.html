<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Armazenamento | YUNNITED CREW</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #07070a; --surface: #101015; --surface-2: #16161c;
    --border: rgba(255,255,255,.07); --border-strong: rgba(255,255,255,.14);
    --text: #f5f5f7; --muted: #8a8a94;
    --accent: #7c5cff; --green: #22c55e; --red: #ff3b30; --amber: #f5b400;
  }
  body {
    background: radial-gradient(1200px 600px at 50% -200px, #16121f 0%, var(--bg) 55%);
    color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Arial, sans-serif;
    margin: 0; padding: 20px 16px 40px; min-height: 100vh; -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1000px; margin: 0 auto; }
  .top { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .brand-mark svg { width: 22px; height: 22px; }
  .brand-mark {
    width: 44px; height: 44px; border-radius: 13px; flex-shrink: 0;
    background: linear-gradient(135deg, #7c5cff, #b44cff);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 15px; color: #fff;
    box-shadow: 0 8px 22px rgba(124,92,255,.35), inset 0 1px 0 rgba(255,255,255,.2);
  }
  .top h1 { font-size: 19px; font-weight: 800; margin: 0; letter-spacing: .3px; }
  .top p { color: var(--muted); font-size: 12.5px; margin: 2px 0 0; }

  .nav { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 22px; }
  .nav a { color: #c5c5cc; text-decoration: none; padding: 8px 14px; border-radius: 10px; font-size: 13px; background: var(--surface); border: 1px solid var(--border); }
  .nav a.active { background: #fff; color: #000; border-color: #fff; font-weight: 600; }

  .section {
    background: linear-gradient(160deg, var(--surface-2) 0%, var(--surface) 100%);
    border: 1px solid var(--border); border-radius: 18px;
    padding: 20px; margin-bottom: 18px;
  }
  .section h2 { font-size: 15px; font-weight: 700; margin: 0 0 16px; }

  .bar { height: 10px; background: #1a1a22; border-radius: 10px; overflow: hidden; margin: 10px 0; }
  .bar-fill { height: 100%; background: linear-gradient(90deg, #22c55e, #4ade80); transition: width .5s; }
  .bar-fill.warn { background: linear-gradient(90deg, #f5b400, #fbbf24); }
  .bar-fill.danger { background: linear-gradient(90deg, #ff3b30, #f87171); }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .stat { padding: 14px; background: #0a0a0f; border: 1px solid var(--border); border-radius: 12px; }
  .stat .label { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
  .stat .value { font-size: 20px; font-weight: 800; margin-top: 6px; letter-spacing: -.3px; }

  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
  .btn { padding: 9px 14px; border-radius: 10px; border: 0; font-size: 13px; font-weight: 700; cursor: pointer; transition: opacity .15s, transform .1s; }
  .btn:active { transform: scale(.97); }
  .btn-primary { background: linear-gradient(135deg, #7c5cff, #b44cff); color: #fff; box-shadow: 0 8px 22px -8px rgba(124,92,255,.6); }
  .btn-ghost { background: var(--surface); border: 1px solid var(--border); color: #c5c5cc; }
  .btn-ghost.active { background: #fff; color: #000; border-color: #fff; }
  .btn-danger { background: var(--red); color: #fff; }
  .btn:disabled { opacity: .35; cursor: not-allowed; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
  .img-card { position: relative; border-radius: 12px; overflow: hidden; border: 2px solid var(--border); aspect-ratio: 1; cursor: pointer; transition: transform .15s, border-color .15s; }
  .img-card:hover { transform: scale(1.02); }
  .img-card.in-use { border-color: rgba(34,197,94,.5); }
  .img-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .img-card .badge { position: absolute; top: 6px; left: 6px; font-size: 9.5px; font-weight: 800; padding: 3px 7px; border-radius: 6px; letter-spacing: .5px; }
  .img-card .badge.used { background: var(--green); color: #fff; }
  .img-card .badge.orphan { background: var(--red); color: #fff; }
  .img-card.selected { border-color: #fff; box-shadow: 0 0 0 3px rgba(255,255,255,.2); }
  .img-card.selected::after { content: ''; position: absolute; inset: 0; background: rgba(124,92,255,.18); pointer-events: none; }
  .img-card input { position: absolute; top: 6px; right: 6px; width: 20px; height: 20px; accent-color: var(--accent); }
  .img-card .size { position: absolute; bottom: 6px; right: 6px; font-size: 10px; color: #fff; background: rgba(0,0,0,.7); padding: 2px 6px; border-radius: 6px; font-weight: 600; }

  #msg { min-height: 20px; font-size: 13px; color: #c5c5cc; margin-bottom: 12px; }

  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); padding: 12px 20px; border-radius: 12px; font-size: 13.5px; font-weight: 600; z-index: 999; box-shadow: 0 12px 30px rgba(0,0,0,.4); }
  .toast.ok { background: var(--green); color: #fff; }
  .toast.err { background: var(--red); color: #fff; }

  .header-divider {
    height: 1px;
    background: rgba(255,255,255,.12);
    margin: 0 0 24px;
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg></div>
    <div>
      <h1>Armazenamento</h1>
      <p>YUNNITED CREW · Cloudinary</p>
    </div>
  </div>

  <div class="header-divider"></div>

  <nav class="nav">
    <a href="/admin/admin.html">Início</a>
    <a href="/admin/produtos.html">Produtos</a>
    <a href="/admin/categorias.html">Categorias</a>
    <a href="/admin/dashboard.html">Dashboard</a>
    <a href="/admin/armazenamento.html" class="active">Armazenamento</a>
    <a href="/admin/perfil.html">Perfil</a>
  </nav>

  <section class="section">
    <h2>Quota</h2>
    <div id="quota"><p style="color:#8a8a94">A carregar...</p></div>
  </section>

  <section class="section">
    <h2>Imagens</h2>
    <div class="toolbar">
      <button class="btn btn-ghost active" data-filter="all">Todas</button>
      <button class="btn btn-ghost" data-filter="in-use">Em uso</button>
      <button class="btn btn-ghost" data-filter="orphans">Órfãs</button>
      <button class="btn btn-danger" id="deleteSelected" disabled>Apagar selecionadas</button>
    </div>
    <p id="msg"></p>
    <div class="grid" id="grid"><p style="color:#8a8a94">A carregar...</p></div>
  </section>
</div>

<script src="/admin/admin-api.js"></script>
<script>
const { requireLogin } = window.YCAdmin;
if (!requireLogin()) throw new Error('redirect');

const TOKEN = () => localStorage.getItem('yc_admin_token');
const fetchAuth = (url, opts = {}) => fetch(url, { ...opts, headers: { ...(opts.headers || {}), Authorization: 'Bearer ' + TOKEN() } });

let allItems = [];
let filter = 'all';
const selected = new Set();

function toast(text, ok = true) {
  const t = document.createElement('div');
  t.className = 'toast ' + (ok ? 'ok' : 'err');
  t.textContent = text;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}
function escapeHtml(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
const fmtBytes = (b) => b < 1024 ? b + ' B' : b < 1024*1024 ? (b/1024).toFixed(1) + ' KB' : (b/1024/1024).toFixed(2) + ' MB';

async function loadQuota() {
  try {
    const r = await fetchAuth('/api/cloudinary/usage');
    const d = await r.json();
    if (!d.success) throw new Error(d.message);
    const c = d.credits || { usage: 0, limit: 25, used_percent: 0 };
    const pct = c.used_percent || 0;
    const cls = pct < 60 ? '' : pct < 85 ? 'warn' : 'danger';
    document.getElementById('quota').innerHTML = `
      <div class="stats">
        <div class="stat"><div class="label">Plano</div><div class="value">${d.plan}</div></div>
        <div class="stat"><div class="label">Armazenamento</div><div class="value">${d.storage.usedMB} MB</div></div>
        <div class="stat"><div class="label">Imagens</div><div class="value">${d.objects?.usage ?? '—'}</div></div>
        <div class="stat"><div class="label">Bandwidth</div><div class="value">${((d.bandwidth?.usage||0)/1024/1024).toFixed(1)} MB</div></div>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:13px"><span>Créditos usados</span><b>${c.usage} / ${c.limit} (${pct}%)</b></div>
      <div class="bar"><div class="bar-fill ${cls}" style="width:${Math.min(100,pct)}%"></div></div>
      <div style="font-size:11px;color:#666;margin-top:4px">No plano Free o Cloudinary usa créditos mensais.</div>
    `;
  } catch (e) {
    document.getElementById('quota').innerHTML = '<p style="color:#ff3b30">Erro: ' + escapeHtml(e.message) + '</p>';
  }
}

async function loadImages() {
  try {
    const r = await fetchAuth('/api/cloudinary/all-images');
    const d = await r.json();
    if (!d.success) throw new Error(d.message);
    allItems = d.items;
    document.getElementById('msg').innerHTML = `<b>${d.total}</b> imagens · <span style="color:#22c55e">${d.inUse} em uso</span> · <span style="color:#ff3b30">${d.orphans} órfãs</span> · ${fmtBytes(d.totalBytes)} (${fmtBytes(d.orphanBytes)} órfãs)`;
    renderGrid();
  } catch (e) {
    document.getElementById('grid').innerHTML = '<p style="color:#ff3b30">Erro: ' + escapeHtml(e.message) + '</p>';
  }
}

function renderGrid() {
  const items = allItems.filter(i => filter === 'all' ? true : filter === 'in-use' ? i.inUse : !i.inUse);
  if (!items.length) { document.getElementById('grid').innerHTML = '<p style="color:#8a8a94">Sem imagens nesta vista.</p>'; return; }
  document.getElementById('grid').innerHTML = items.map(i => {
    const sel = selected.has(i.public_id);
    return `<div class="img-card ${i.inUse ? 'in-use' : ''} ${sel ? 'selected' : ''}" data-id="${i.public_id}">
      <img src="${i.url}" loading="lazy" alt="">
      <span class="badge ${i.inUse ? 'used' : 'orphan'}">${i.inUse ? 'EM USO' : 'ÓRFÃ'}</span>
      ${!i.inUse ? `<input type="checkbox" data-id="${i.public_id}" ${sel ? 'checked' : ''}>` : ''}
      <span class="size">${fmtBytes(i.bytes)}</span>
    </div>`;
  }).join('');

  document.querySelectorAll('.img-card input[type=checkbox]').forEach(cb => {
    cb.addEventListener('click', (e) => {
      e.stopPropagation();
      if (cb.checked) selected.add(cb.dataset.id); else selected.delete(cb.dataset.id);
      updateDeleteButton();
      cb.closest('.img-card').classList.toggle('selected', cb.checked);
    });
  });
  document.querySelectorAll('.img-card').forEach(el => {
    el.addEventListener('click', (e) => {
      if (e.target.tagName === 'INPUT') return;
      const id = el.dataset.id;
      const item = allItems.find(i => i.public_id === id);
      if (!item || item.inUse) return;
      if (selected.has(id)) selected.delete(id); else selected.add(id);
      el.classList.toggle('selected', selected.has(id));
      const cb = el.querySelector('input[type=checkbox]');
      if (cb) cb.checked = selected.has(id);
      updateDeleteButton();
    });
  });
  updateDeleteButton();
}

function updateDeleteButton() {
  const btn = document.getElementById('deleteSelected');
  btn.disabled = selected.size === 0;
  btn.textContent = selected.size ? `Apagar ${selected.size} imagem(ns)` : 'Apagar selecionadas';
}

document.querySelectorAll('.toolbar [data-filter]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.toolbar [data-filter]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    filter = btn.dataset.filter;
    renderGrid();
  });
});

document.getElementById('deleteSelected').addEventListener('click', async () => {
  if (!selected.size) return;
  const list = [...selected];
  const totalBytes = list.reduce((s, id) => s + (allItems.find(i => i.public_id === id)?.bytes || 0), 0);
  if (!confirm(`Apagar ${list.length} imagem(ns) órfã(s)?\n\nTotal: ${fmtBytes(totalBytes)}\n\nEsta ação é permanente no Cloudinary.`)) return;
  const btn = document.getElementById('deleteSelected');
  btn.disabled = true;
  let ok = 0, fail = 0;
  for (const id of list) {
    try {
      const r = await fetchAuth('/api/cloudinary/image/' + encodeURIComponent(id), { method: 'DELETE' });
      const d = await r.json();
      if (d.success) { ok++; selected.delete(id); allItems = allItems.filter(i => i.public_id !== id); } else fail++;
    } catch { fail++; }
  }
  toast(`Apagadas: ${ok} · Falhas: ${fail}`, fail === 0);
  renderGrid();
  loadQuota();
});

loadQuota();
loadImages();
</script>
</body>
</html>
